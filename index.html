<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal de Agentes - Métricas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h1, h2, h3 { color: #d81b60; text-align: center; }
        .login-box { text-align: center; margin: 40px 0; }
        input[type="email"], input[type="date"] { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background-color: #d81b60; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #ad1457; }
        .hidden { display: none; }
        
        /* Tablas */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; }
        th, td { padding: 10px; border: 1px solid #ddd; text-align: center; }
        th { background-color: #f8bbd0; color: #333; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        
        /* Tarjetas de Totales */
        .cards-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-top: 20px; margin-bottom: 30px; }
        .card { background: #fff; border-left: 5px solid #d81b60; padding: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 200px; text-align: center; }
        .card h3 { margin: 0; font-size: 14px; color: #777; text-align: center; }
        .card p { margin: 10px 0 0; font-size: 24px; font-weight: bold; color: #333; }
        
        #error-msg { color: red; text-align: center; margin-top: 10px; font-weight: bold; }
        .filter-box { background: #f0f0f0; padding: 15px; border-radius: 8px; margin-top: 20px; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <h1>Portal de Agentes</h1>
    
    <!-- Formulario de Login -->
    <div id="login-section" class="login-box">
        <p>Ingresa tu correo corporativo para ver tus métricas:</p>
        <input type="email" id="email-input" placeholder="ejemplo@mediamarkt.es">
        <br><br>
        <button onclick="login()">Consultar mis datos</button>
        <div id="error-msg"></div>
    </div>

    <!-- Dashboard (Oculto inicialmente) -->
    <div id="dashboard-section" class="hidden">
        <h2 id="agent-name">Bienvenido</h2>
        <div style="text-align: center;"><button onclick="logout()" style="background: #666;">Cerrar Sesión</button></div>
        
        <!-- Filtro de Fechas -->
        <div class="filter-box">
            <label><strong>Filtrar por fechas:</strong></label><br>
            <label>Desde: <input type="date" id="fecha-inicio"></label>
            <label>Hasta: <input type="date" id="fecha-fin"></label>
            <button onclick="aplicarFiltro()" style="margin-left: 10px;">Aplicar Filtro</button>
            <button onclick="resetFiltro()" style="background: #999; margin-left: 5px;">Ver Todo el Mes</button>
        </div>

        <!-- Resumen Total (Dinámico según filtro) -->
        <h3>Resumen del Período</h3>
        <div class="cards-container" id="totales-cards">
            <!-- Se llena con JS -->
        </div>

        <!-- Tabla Diaria -->
        <h3>Detalle Diario</h3>
        <div style="overflow-x: auto;">
            <table id="tabla-diaria">
                <thead>
                    <tr>
                        <th>Fecha</th>
                        <th>Handled</th>
                        <th>AHT (S)</th>
                        <th>% FCR</th>
                        <th>% CSAT</th>
                        <th>% Ratio</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    let datosTotales = [];
    let datosBase = [];
    let agenteLogueado = "";
    let datosAgenteFiltrados = []; // Datos base filtrados por fecha

    // 1. Cargar CSV
    async function cargarDatos() {
        try {
            const resTotales = await fetch('totales.csv');
            const textTotales = await resTotales.text();
            datosTotales = parseCSV(textTotales);

            const resBase = await fetch('base.csv');
            const textBase = await resBase.text();
            datosBase = parseCSV(textBase);
            
            console.log("Datos cargados");
        } catch (error) {
            console.error("Error cargando CSV", error);
            document.getElementById('error-msg').innerText = "Error al cargar datos. Recarga la página.";
        }
    }

    // Parser CSV
    function parseCSV(text) {
        const lines = text.split('\n').filter(line => line.trim() !== '');
        const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
        const result = [];
        for(let i = 1; i < lines.length; i++) {
            const currentline = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g);
            if(!currentline) continue;
            const obj = {};
            headers.forEach((header, index) => {
                let val = currentline[index] ? currentline[index].replace(/^"|"$/g, '').trim() : "";
                obj[header] = val;
            });
            result.push(obj);
        }
        return result;
    }

    // Login
    function login() {
        const email = document.getElementById('email-input').value.trim().toLowerCase();
        if(!email) return;
        
        const agenteTotal = datosTotales.find(a => a['Email_Key'] && a['Email_Key'].toLowerCase() === email);
        
        if (agenteTotal) {
            agenteLogueado = email;
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
            document.getElementById('agent-name').innerText = "Hola, " + agenteTotal['NOMBRE COMPLETO'];
            
            // Inicializar fechas (min y max del agente)
            const fechas = datosBase
                .filter(r => r['Email_Key'] && r['Email_Key'].toLowerCase() === email)
                .map(r => r['DATE'] ? r['DATE'].split(' ')[0] : '')
                .filter(f => f)
                .sort();
            
            if(fechas.length > 0) {
                document.getElementById('fecha-inicio').value = fechas[0];
                document.getElementById('fecha-fin').value = fechas[fechas.length - 1];
            }

            aplicarFiltro(); // Carga inicial con todo el mes
        } else {
            document.getElementById('error-msg').innerText = "Correo no encontrado.";
        }
    }

    function logout() {
        document.getElementById('email-input').value = '';
        document.getElementById('error-msg').innerText = '';
        document.getElementById('login-section').classList.remove('hidden');
        document.getElementById('dashboard-section').classList.add('hidden');
    }

    // Filtrar por fechas y recalcular totales
    function aplicarFiltro() {
        const inicio = document.getElementById('fecha-inicio').value;
        const fin = document.getElementById('fecha-fin').value;
        
        if(!inicio || !fin) return;

        // 1. Filtrar las filas diarias del agente
        datosAgenteFiltrados = datosBase.filter(row => {
            if(!row['Email_Key'] || row['Email_Key'].toLowerCase() !== agenteLogueado) return false;
            const fechaRow = row['DATE'] ? row['DATE'].split(' ')[0] : '';
            return fechaRow >= inicio && fechaRow <= fin;
        });

        // 2. Recalcular totales con los datos filtrados (Lógica ponderada)
        let sumHandled = 0;
        let sumCalcAHT = 0;
        let sumFCRReplies = 0;
        let sumFCRPos = 0;
        let sumCSATReplies = 0;
        let sumCSATPos = 0;
        let sumHandledNoTrans = 0;
        let sumCBTNoTrans = 0;

        datosAgenteFiltrados.forEach(row => {
            const h = parseFloat(row['HANDLED INBOUND']) || 0;
            const aht = parseFloat(row['AHT (S)']) || 0;
            sumHandled += h;
            sumCalcAHT += (h * aht);
            
            sumFCRReplies += parseFloat(row['IVR FCR REPLIES']) || 0;
            sumFCRPos += parseFloat(row['IVR FCR POSITIVE']) || 0;
            sumCSATReplies += parseFloat(row['IVR CSAT REPLIES']) || 0;
            sumCSATPos += parseFloat(row['IVR CSAT POSITIVE']) || 0;
            
            sumHandledNoTrans += parseFloat(row['HANDLED INBOUND (NO TRANSFERS)']) || 0;
            sumCBTNoTrans += parseFloat(row['CALL BLIND TRANSFERS (NO TRANSFERS)']) || 0;
        });

        // Calcular promedios/porcentajes finales
        const ahtTotal = sumHandled > 0 ? (sumCalcAHT / sumHandled) : 0;
        const fcrTotal = sumFCRReplies > 0 ? (sumFCRPos / sumFCRReplies) : 0;
        const csatTotal = sumCSATReplies > 0 ? (sumCSATPos / sumCSATReplies) : 0;
        const ratioTotal = sumHandledNoTrans > 0 ? (sumCBTNoTrans / sumHandledNoTrans) : 0;

        // Actualizar Tarjetas
        const container = document.getElementById('totales-cards');
        container.innerHTML = `
            <div class="card"><h3>AHT Promedio</h3><p>${ahtTotal.toFixed(2)}s</p></div>
            <div class="card"><h3>% FCR</h3><p>${(fcrTotal * 100).toFixed(2)}%</p></div>
            <div class="card"><h3>% CSAT</h3><p>${(csatTotal * 100).toFixed(2)}%</p></div>
            <div class="card"><h3>% Ratio</h3><p>${(ratioTotal * 100).toFixed(2)}%</p></div>
        `;

        // Actualizar Tabla
        const tbody = document.querySelector('#tabla-diaria tbody');
        tbody.innerHTML = '';
        
        datosAgenteFiltrados.sort((a,b) => (a['DATE'] || '').localeCompare(b['DATE'] || '')).forEach(row => {
            const tr = document.createElement('tr');
            const fecha = row['DATE'] ? row['DATE'].split(' ')[0] : '';
            const fcrRow = row['% IVR FCR'] ? (parseFloat(row['% IVR FCR']) * 100).toFixed(1) + '%' : '-';
            const csatRow = row['% IVR CSAT'] ? (parseFloat(row['% IVR CSAT']) * 100).toFixed(1) + '%' : '-';
            const ratioRow = row['% RATIO (CBT/HANDLED)'] ? (parseFloat(row['% RATIO (CBT/HANDLED)']) * 100).toFixed(1) + '%' : '-';
            const ahtRow = row['AHT (S)'] ? parseFloat(row['AHT (S)']).toFixed(0) : '-';
            
            tr.innerHTML = `
                <td>${fecha}</td>
                <td>${row['HANDLED INBOUND'] || 0}</td>
                <td>${ahtRow}</td>
                <td>${fcrRow}</td>
                <td>${csatRow}</td>
                <td>${ratioRow}</td>
            `;
            tbody.appendChild(tr);
        });
    }

    function resetFiltro() {
        // Volver a poner las fechas min/max originales
        const fechas = datosBase
            .filter(r => r['Email_Key'] && r['Email_Key'].toLowerCase() === agenteLogueado)
            .map(r => r['DATE'] ? r['DATE'].split(' ')[0] : '')
            .filter(f => f)
            .sort();
        if(fechas.length > 0) {
            document.getElementById('fecha-inicio').value = fechas[0];
            document.getElementById('fecha-fin').value = fechas[fechas.length - 1];
            aplicarFiltro();
        }
    }

    // Iniciar
    cargarDatos();
</script>

</body>
</html>
